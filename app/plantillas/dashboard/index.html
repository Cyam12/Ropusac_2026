<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>
        {{ titulo }} | ROPUSAC
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <span class="navbar-brand">
                ROPUSAC
            </span>

            <form
                method="POST"
                action="{{ url_for('autenticacion.logout') }}"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <button
                    class="btn btn-outline-light btn-sm"
                    type="submit"
                >
                    Cerrar sesión
                </button>

            </form>

        </div>

    </nav>


    <main class="container py-5">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <h1 class="h3">
                    {{ titulo }}
                </h1>

                <p class="mb-1">

                    Usuario:

                    <strong>
                        {{ current_user.nombre_completo }}
                    </strong>

                </p>

                <p class="mb-0">

                    Rol:

                    <strong>
                        {{ current_user.rol.nombre }}
                    </strong>

                </p>

            </div>

        </div>

    </main>

</body>

</html>
